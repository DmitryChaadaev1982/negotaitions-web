# NegotAItions sanitized access-log format (Stage 3.14A-S)
#
# Include this file from the nginx `http` context only.
# `map` and `log_format` are invalid in `server` / `location`.
#
# Production placement:
#   /etc/nginx/snippets/negotaitions-sanitized-access-log.conf
#   included from /etc/nginx/nginx.conf before access_log.
#
# What this does:
#   - never logs query strings
#   - never logs $request or $request_uri
#   - never logs Referer
#   - redacts token-bearing pathname segments
#
# Token-bearing pathname families covered:
#   /join/:joinToken
#   /events/join/:publicJoinCode
#
# Query-borne secrets (joinToken, hostToken, participantToken, token,
# returnUrl-embedded tokens, materials/status query tokens) are dropped
# because the logged path is $uri (query-free) after sanitization.
#
# Do not match /events/:id/join — that account path has no secret segment.

map $uri $negotaitions_sanitized_uri {
    default $uri;
    ~*^/join/[^/]+(/.*)?$          /join/[redacted]$1;
    ~*^/events/join/[^/]+(/.*)?$   /events/join/[redacted]$1;
}

log_format negotaitions_sanitized
    '$remote_addr - $remote_user [$time_local] '
    '"$request_method $negotaitions_sanitized_uri $server_protocol" '
    '$status $body_bytes_sent '
    '"$http_user_agent"';
