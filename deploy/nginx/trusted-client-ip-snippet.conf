# NegotAItions trusted client-IP header snippet (Stage 3.13C-P)
#
# Apply inside every location that proxies to the Next.js application for:
#   - negotaitions.ru / www.negotaitions.ru / app.negotaitions.ru
#   - local.negotaitions.ru (reverse-tunnel and any app-VM local-dev vhost)
#
# This snippet overwrites browser-controlled values. Do not use
# $proxy_add_x_forwarded_for for the dedicated application header.
#
# Activation is a future controlled nginx change. Do not apply blindly.

proxy_set_header X-NegotAItions-Client-IP $remote_addr;
proxy_set_header X-Real-IP $remote_addr;
proxy_set_header X-Forwarded-For $remote_addr;
proxy_set_header X-Forwarded-Proto $scheme;
proxy_set_header X-Forwarded-Host $host;
